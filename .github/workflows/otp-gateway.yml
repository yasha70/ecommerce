# Builds the OTP Gateway Android app (otp-service/android-gateway) and publishes the APK as the
# GitHub release "otp-gateway-latest", which the OTP Verify admin panel links to (/gateway.apk).
name: OTP Gateway app

on:
  workflow_dispatch:
  push:
    paths:
      - 'otp-service/android-gateway/**'
      - '.github/workflows/otp-gateway.yml'

permissions:
  contents: write

concurrency:
  group: otp-gateway
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        working-directory: otp-service/android-gateway
        run: gradle :app:assembleDebug --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          cp otp-service/android-gateway/app/build/outputs/apk/debug/app-debug.apk out/OTPGateway.apk
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: OTPGateway
          path: out/OTPGateway.apk

      - name: Publish as the otp-gateway-latest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notes="OTP Gateway app built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}. Install on the Android phone that has the gateway SIM."
          if gh release view otp-gateway-latest >/dev/null 2>&1; then
            gh release upload otp-gateway-latest out/OTPGateway.apk --clobber
            gh release edit otp-gateway-latest --notes "$notes"
          else
            gh release create otp-gateway-latest out/OTPGateway.apk --target "$GITHUB_SHA" \
              --title "OTP Gateway app" --notes "$notes" --latest=false
          fi
